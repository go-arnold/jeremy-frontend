            schema:
              $ref: '#/components/schemas/PatchedArticleWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedArticleWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleWrite'
          description: ''
    delete:
      operationId: articles_destroy
      description: |-
        Adds the stricter `upload` throttle scope on top of the default ones for create/update
        actions — for ViewSets whose write serializer accepts a CloudinaryField (image/audio/video).
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Articles
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
