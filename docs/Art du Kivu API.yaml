openapi: 3.0.3
info:
  title: Art du Kivu API
  version: 1.0.0
  description: Congolese music & arts platform API
paths:
  /api/v1/analytics/dashboard/:
    get:
      operationId: analytics_dashboard_retrieve
      description: Site-wide aggregate stats. Cached 10 minutes — not real-time.
      tags:
      - Analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
              examples:
                StatistiquesDuTableauDeBord:
                  value:
                    counts:
                      artists: 128
                      articles: 340
                      events: 24
                      podcast_episodes: 512
                    totals:
                      article_views: 98234
                      webtv_views: 45210
                      podcast_plays: 61234
                    top_articles:
                    - title: La scène musicale de Goma en 2026
                      view_count: 4210
                    top_webtv_videos:
                    - title: 'Freestyle #12'
                      view_count: 3820
                    top_podcast_episodes:
                    - title: Épisode 12
                      play_count: 2110
                  summary: Statistiques du tableau de bord
          description: ''
  /api/v1/articles/:
    get:
      operationId: articles_list
      description: |-
        Adds the stricter `upload` throttle scope on top of the default ones for create/update
        actions — for ViewSets whose write serializer accepts a CloudinaryField (image/audio/video).
      parameters:
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      tags:
      - Articles
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArticleListList'
          description: ''
    post:
      operationId: articles_create
      description: |-
        Adds the stricter `upload` throttle scope on top of the default ones for create/update
        actions — for ViewSets whose write serializer accepts a CloudinaryField (image/audio/video).
      tags:
      - Articles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleWriteRequest'
            examples:
              ArticleAvecCatégorieParSlug:
                value:
                  title: La scène musicale de Goma en 2026
                  excerpt: Un tour d'horizon des artistes montants.
                  content: <p>Contenu complet de l'article...</p>
                  featured_image: https://res.cloudinary.com/artdukivu/image/upload/v1721581234/articles/covers/goma.jpg
                  category: arts-visuels
                  article_type: blog
                  status: draft
                summary: Article avec catégorie par slug
              ArticleProgrammé(sansCatégorie):
                value:
                  title: Édition spéciale
                  content: <p>...</p>
                  status: draft
                  scheduled_at: '2026-08-15T08:00:00Z'
                summary: Reste en draft jusqu'à ce que scheduled_at soit passé (publication
                  auto).
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArticleWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArticleWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleWrite'
          description: ''
  /api/v1/articles/{slug}/:
    get:
      operationId: articles_retrieve
