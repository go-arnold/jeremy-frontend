components:
  schemas:
    ActivityEntry:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/ActivityEntryActionEnum'
        created_at:
          type: string
          format: date-time
        excerpt:
          type: string
        target:
          $ref: '#/components/schemas/ProfileTarget'
      required:
      - action
      - created_at
      - target
    ActivityEntryActionEnum:
      enum:
      - like
      - comment
      type: string
      description: |-
        * `like` - like
        * `comment` - comment
    ArticleDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 300
        slug:
          type: string
          maxLength: 320
          pattern: ^[-a-zA-Z0-9_]+$
        excerpt:
          type: string
        content:
          type: string
        featured_image_url:
          type: string
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          readOnly: true
        author:
          allOf:
          - $ref: '#/components/schemas/AuthorBrief'
          readOnly: true
        article_type:
          $ref: '#/components/schemas/ArticleTypeEnum'
        read_time:
          type: integer
          maximum: 32767
          minimum: 0
        view_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        like_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_featured:
          type: boolean
        status:
          $ref: '#/components/schemas/Status68aEnum'
        published_at:
          type: string
          format: date-time
          nullable: true
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
          readOnly: true
      required:
      - author
      - category
      - comments
      - content
      - featured_image_url
      - id
      - slug
      - tags
      - title
